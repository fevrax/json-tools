# 站点 AI 入口按客户端 IP 限流，防止共享线路无限并发。
limit_req_zone $binary_remote_addr zone=ai_requests:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ai_connections:10m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/ai-proxy.conf;

    # 支持 HTML5 History 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物可长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA 的入口和版本文件必须及时重新验证，否则会延迟发现新版本。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
